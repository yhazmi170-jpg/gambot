<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Gambot</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="dashboard">
  <nav class="navbar">
    <div class="nav-brand">🎰 Gambot</div>
    <div class="nav-user">
      <span id="username">Loading...</span>
      <a href="/auth/logout" class="logout-btn">Logout</a>
    </div>
  </nav>

  <main class="container">
    <div class="cards">
      <div class="card">
        <div class="card-icon">💰</div>
        <div class="card-value" id="balance">—</div>
        <div class="card-label">Balance</div>
      </div>
      <div class="card">
        <div class="card-icon">💎</div>
        <div class="card-value" id="gems">—</div>
        <div class="card-label">Gems</div>
      </div>
      <div class="card">
        <div class="card-icon">🐾</div>
        <div class="card-value" id="animals">—</div>
        <div class="card-label">Animals</div>
      </div>
      <div class="card">
        <div class="card-icon">🎯</div>
        <div class="card-value" id="perks">—</div>
        <div class="card-label">Perks</div>
      </div>
    </div>

    <div class="section">
      <h2>🏆 Top 10 Leaderboard</h2>
      <div class="leaderboard" id="leaderboard">Loading...</div>
    </div>

    <div class="section">
      <h2>📊 Global Stats</h2>
      <div class="stats" id="stats">Loading...</div>
    </div>
  </main>

  <script src="/dashboard.js"></script>
</body>
</html>
