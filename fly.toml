app = "gambot-cloud"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  PRODUCTION = "true"
  DB_PATH = "/app/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[mounts]
  source = "gambot_data"
  destination = "/app/data"

[[restart]]
  policy = "always"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
