services:
  - type: web
    name: gambot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: TOKEN
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: DB_PATH
        value: ./data
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
