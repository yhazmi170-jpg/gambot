services:
  - type: web
    name: gambot
    env: node
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: TOKEN
        sync: false
      - key: DB_PATH
        value: /var/data
    disk:
      name: gambot-data
      mountPath: /var/data
      sizeGB: 1
